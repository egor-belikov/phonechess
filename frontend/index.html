<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#161512">
  <title>PhoneChess</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <link rel="stylesheet" href="styles/main.css?v=20260327104255">
</head>
<body>
  <!-- Блокировщик: только мобильный телефон (не планшет, не десктоп) -->
  <div id="mobile-only-block" class="mobile-only-block" aria-hidden="true">
    <p class="mobile-only-title">PhoneChess</p>
    <p class="mobile-only-text">Откройте приложение на смартфоне в Telegram.</p>
    <p class="mobile-only-hint">Планшеты и компьютер не поддерживаются.</p>
  </div>
  <div id="app">
    <!-- Лобби -->
    <section id="lobby-screen" class="screen active">
      <h1 class="title">PhoneChess</h1>
      <p class="subtitle">Выберите контроль времени</p>
      <div class="lobby-grid" id="lobby-buttons"></div>
      <button type="button" id="btn-private-game" class="btn-private-game">Приватная игра</button>
      <p id="ws-status" class="ws-status">Подключение…</p>
    </section>
    <div id="private-time-modal" class="private-time-modal" aria-hidden="true">
      <div class="private-time-card">
        <div class="private-time-title">Приватная игра</div>
        <div id="private-time-grid" class="private-time-grid"></div>
        <button type="button" id="btn-private-time-close" class="btn-private-time-close">Cancel</button>
      </div>
    </div>

    <!-- Игра: часы, доска, список ходов -->
    <section id="game-screen" class="screen">
      <div class="game-header">
        <button type="button" class="btn-back" id="btn-back-game" aria-label="Назад">←</button>
        <span id="game-info">Партия</span>
      </div>
      <div id="game-alert" class="game-alert"></div>
      <div class="game-layout">
        <div class="player-row player-row-top">
          <div class="player-meta">
            <div id="clock-top-label" class="clock-label"></div>
          </div>
          <div id="clock-top" class="clock"></div>
        </div>
        <div class="board-wrap">
          <div id="chess-board" class="chess-board"></div>
          <div id="promotion-picker" class="promotion-picker" aria-hidden="true">
            <div id="promotion-choices" class="promotion-choices"></div>
          </div>
        </div>
        <div class="player-row player-row-bottom">
          <div class="player-meta">
            <div id="clock-bottom-label" class="clock-label"></div>
            <div id="game-your-side" class="game-your-side"></div>
          </div>
          <div id="clock-bottom" class="clock"></div>
        </div>
        <div class="moves-panel">
          <div class="moves-header">Ходы</div>
          <div id="move-list" class="move-list"></div>
          <div class="game-actions">
            <button type="button" class="btn-replay" id="btn-replay-first">|&lt;</button>
            <button type="button" class="btn-replay" id="btn-replay-prev">&lt;</button>
            <button type="button" class="btn-replay" id="btn-replay-next">&gt;</button>
            <button type="button" class="btn-replay" id="btn-replay-last">&gt;|</button>
            <button type="button" class="btn-flip" id="btn-flip-board">Повернуть доску</button>
            <button type="button" class="btn-draw" id="btn-draw">Ничья?</button>
            <button type="button" class="btn-draw-claim" id="btn-claim-draw">Заявить ничью</button>
            <button type="button" class="btn-resign" id="btn-resign">Сдаться</button>
          </div>
          <div id="analysis-panel" class="analysis-panel">
            <div id="analysis-score" class="analysis-score">+0.00</div>
            <button type="button" id="btn-analysis-toggle" class="btn-analysis-toggle">Start analysis</button>
            <div id="analysis-line" class="analysis-line">—</div>
          </div>
        </div>
      </div>
    </section>

  </div>
  <div id="result-modal" class="result-modal" aria-hidden="true">
    <div class="result-modal-card">
      <div id="result-modal-title" class="result-modal-title">Партия завершена</div>
      <div id="result-modal-text" class="result-modal-text">—</div>
      <button type="button" id="btn-result-lobby" class="btn-result-lobby">Вернуться в лобби</button>
    </div>
  </div>
  <div id="build-info" class="build-info">Версия: 2fd3e4f · Деплой: 2026-03-27 10:42:55 UTC</div>
  <script src="app.js?v=20260327104255"></script>
</body>
</html>
