services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-phonechess}
      - POSTGRES_USER=${POSTGRES_USER:-phonechess}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-phonechess}
    volumes:
      - phonechess_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # Shared VPS: if the host runs out of memory, the kernel should kill anything but the game.
    oom_score_adj: -800

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Production sets APP_BIND_ADDR to the docker bridge gateway (nginx proxies to it),
      # so the app is not reachable from the internet directly, only via nginx/TLS.
      - "${APP_BIND_ADDR:-0.0.0.0}:8000:8000"
    depends_on:
      - db
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://phonechess:phonechess@db:5432/phonechess}
      - DEBUG=${DEBUG:-0}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    restart: unless-stopped
    oom_score_adj: -800

volumes:
  phonechess_pgdata:
